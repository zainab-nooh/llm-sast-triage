# Runs the test suite on every push to main and every pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the code
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit id (a tag can be moved; a commit cannot)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the pinned packages
        run: python -m pip install -r requirements.txt
      - name: Check the packages fit together
        run: python -m pip check
      - name: Run the tests
        run: python -m pytest -q
