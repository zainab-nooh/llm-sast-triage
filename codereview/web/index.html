<!doctype html>
<html lang="en" data-style="meridian3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAST Triage</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Main">
    <span class="logo" role="img" aria-label="SAST Triage by ZN"><i class="lm"></i><i class="lb"></i></span>
    <div>
      <div class="nav-label">Overview</div>
      <a href="#dashboard" data-v="dashboard">Dashboard</a>
      <a href="#report" data-v="report">OWASP Top 10</a>
    </div>
    <div>
      <div class="nav-label">Triage</div>
      <a href="#issues" data-v="issues">Triage inbox<span class="count" id="navCount"></span></a>
      <a href="#review" data-v="review">Needs your review<span class="count warn" id="navReview"></span></a>
      <a href="#decisions" data-v="decisions">Your decisions<span class="count ok" id="navMine"></span></a>
    </div>
    <div>
      <div class="nav-label">Scans</div>
      <a href="#newscan" data-v="newscan">New scan</a>
      <a href="#projects" data-v="projects">Projects</a>
      <a href="#scans" data-v="scans">Scan history</a>
      <a href="#compare" data-v="compare">Compare scans</a>
    </div>
    <div>
      <div class="nav-label">Setup</div>
      <a href="#config" data-v="config">Models &amp; settings</a>
      <a href="#integrations" data-v="integrations">GitHub</a>
    </div>
    <div class="nav-foot">
      <div class="runbox" id="runbox" hidden></div>
      <div><span class="dot"></span>Running on this computer</div>
      <div id="footLast"></div>
      <div id="footModel">Checking setup…</div>
    </div>
  </nav>
  <div class="main">
    <header class="top">
      <span class="logo mlogo" role="img" aria-label="SAST Triage by ZN"><i class="lm"></i><i class="lb"></i></span>
      <div><div class="crumb top-c" id="crumb">Workspace</div><h1 id="title">Dashboard</h1></div>
      <span class="sp"></span>
      <span class="live" id="live"><span class="dot"></span><span id="liveTxt">Live</span></span>
      <input class="gsearch" id="gsearch" type="search" placeholder="Search file, rule or type" aria-label="Search file, rule or type (press Enter)">
      <button class="tbtn themesw" id="appTheme" type="button">Dark</button>
      <button class="go newscan" id="newScan" type="button">New scan</button>
      <nav class="tabs-m" id="mnav" aria-label="Pages"></nav>
    </header>
    <div class="fbar" id="fbar" hidden></div>
    <div class="content" id="view"><div class="empty">Loading…</div></div>
  </div>
</div>
<div id="layer"></div>
<div class="tip" id="tip" hidden></div>
<script src="app.js"></script>
</body>
</html>
