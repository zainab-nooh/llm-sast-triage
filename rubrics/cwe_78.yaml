id: SEC-003
cwe: CWE-78
title: OS command injection
rubric:
- A fixed command list with shell=False and no user data in the arguments is safe.
- shell=True with any user-controlled part of the command string is unsafe.
- Quoting with shlex.quote on every user value reduces risk but still needs review.
- A command argument chosen from a fixed allow-list is safe.
- If the program name or path itself is a variable (from configuration, settings, a database or a request),
  the command is not fixed, even without a shell. Answer uncertain unless the code shows it is a constant or
  chosen from an allow-list.
examples:
- code: subprocess.run(['ls', '-l'], check=True)
  verdict: likely_false_positive
  why: Fixed argument list, no shell.
- code: subprocess.run('ping ' + host, shell=True)
  verdict: confirmed
  why: User data inside a shell command string.
- code: subprocess.run([config.get('scanner', 'path'), filename])
  verdict: uncertain
  why: The program to run comes from configuration, which users may be able to change.
